
services:
  testflow-database:
    image: postgres:17
    environment:
      POSTGRES_DB: testflow
      POSTGRES_USER: testflow
      POSTGRES_PASSWORD: testflow
    ports:
      - "5432:5432"
    volumes:
      - testflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testflow -d testflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  testflow_data:
